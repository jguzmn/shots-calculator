<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Tragos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Calculadora de Tragos</h1>

    <div id="mensaje" class="message" role="status" hidden></div>

    <label for="botella">Tipo de botella:</label>
    <select id="botella"></select>

    <label for="pesoActual">Peso actual (g):</label>
    <input type="number" id="pesoActual" placeholder="Ej. 1250" />

    <label for="tamTrago">Tamaño trago (mL):</label>
    <input type="number" id="tamTrago" value="60" />

    <button id="btnCalcular" type="button">Calcular</button>

    <section id="resultado" aria-label="Resultado del calculo">
      <p><strong>Peso del licor:</strong> <span id="pesoLicor">-</span> g</p>
      <p><strong>Tragos decimales:</strong> <span id="tragosDecimales">-</span></p>
      <p><strong>Tragos (fracción):</strong> <span id="tragosFraccion">-</span></p>
    </section>

    <a href="botellas.html" class="link-admin">Administrar botellas</a>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
