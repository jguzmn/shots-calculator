<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Tragos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">BE</span>
        <span class="brand-name">BarraExacta</span>
      </a>

      <nav class="topnav" aria-label="Navegación principal">
        <a class="nav-link active" href="index.html">Calculadora</a>
        <a class="nav-link" href="botellas.html">Botellas</a>
        <a class="nav-link" href="historial.html">Historial</a>
      </nav>

      <button id="btnCerrarSesion" class="button button-secondary topbar-action" type="button">Cerrar sesión</button>
    </header>

    <main class="workspace">
      <section class="page-header">
        <div>
          <p class="eyebrow">Operación</p>
          <h1>Calculadora de Tragos</h1>
        </div>
        <a href="botellas.html" class="button button-secondary">Administrar botellas</a>
      </section>

      <div id="mensaje" class="message" role="status" hidden></div>

      <section class="calculator-layout">
        <div class="panel">
          <div class="panel-header">
            <h2>Datos de medicion</h2>
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="botella">Tipo de botella</label>
              <select id="botella"></select>
            </div>

            <div class="field">
              <label for="pesoActual">Peso actual (g)</label>
              <input type="number" id="pesoActual" placeholder="Ej. 1250" />
            </div>

            <div class="field">
              <label for="tamTrago">Tamaño trago (mL)</label>
              <input type="number" id="tamTrago" value="60" />
            </div>
          </div>

          <button id="btnCalcular" class="button button-primary form-action" type="button">Calcular</button>
        </div>

        <section id="resultado" class="panel result-panel" aria-label="Resultado del cálculo">
          <div class="panel-header">
            <h2>Resultado</h2>
          </div>

          <div class="metric-row">
            <span class="metric-label">Peso del licor</span>
            <strong><span id="pesoLicor">-</span> g</strong>
          </div>

          <div class="metric-row">
            <span class="metric-label">Tragos decimales</span>
            <strong><span id="tragosDecimales">-</span></strong>
          </div>

          <div class="metric-row">
            <span class="metric-label">Tragos en fracción</span>
            <strong><span id="tragosFraccion">-</span></strong>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
