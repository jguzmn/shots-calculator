<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial de Mediciones | BarraExacta</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="historial.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">BE</span>
        <span class="brand-name">BarraExacta</span>
      </a>

      <nav class="topnav" aria-label="Navegación principal">
        <a class="nav-link" href="index.html">Calculadora</a>
        <a class="nav-link bottle-admin-only" href="botellas.html" hidden>Botellas</a>
        <a class="nav-link active" href="historial.html">Historial</a>
        <a class="nav-link platform-admin-only" href="admin-clientes.html" hidden>Clientes</a>
        <a class="nav-link client-admin-only" href="admin-usuarios.html" hidden>Usuarios</a>
      </nav>

      <button id="btnCerrarSesion" class="button button-secondary topbar-action" type="button">Cerrar sesión</button>
    </header>

    <main class="workspace">
      <section class="page-header">
        <div>
          <p class="eyebrow">Control</p>
          <h1>Historial de Mediciones</h1>
        </div>

        <a id="btnExportarCsv" href="/api/mediciones.csv" class="button button-secondary">Exportar CSV</a>
      </section>

      <div id="mensaje" class="message" role="status" hidden></div>

      <section class="panel admin-form-panel">
        <div class="panel-header">
          <h2>Filtros</h2>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="filtroBotella">Botella</label>
            <select id="filtroBotella"></select>
          </div>
          <div class="field">
            <label for="fechaDesde">Fecha desde</label>
            <input id="fechaDesde" type="date" />
          </div>
          <div class="field">
            <label for="fechaHasta">Fecha hasta</label>
            <input id="fechaHasta" type="date" />
          </div>
        </div>

        <div class="form-actions">
          <button id="btnLimpiarFiltros" type="button" class="button button-secondary">Limpiar</button>
          <button id="btnAplicarFiltros" type="button" class="button button-primary">Aplicar filtros</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Últimas mediciones</h2>
        </div>

        <div class="table-wrap">
          <table id="tablaMediciones">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Botella</th>
                <th>Peso actual</th>
                <th>Trago</th>
                <th>Tragos</th>
                <th>Usuario</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
