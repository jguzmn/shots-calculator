<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Botella</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="botella-form.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">BE</span>
        <span class="brand-name">BarraExacta</span>
      </a>

      <nav class="topnav" aria-label="Navegación principal">
        <a class="nav-link" href="index.html">Calculadora</a>
        <a class="nav-link active bottle-admin-only" href="botellas.html" hidden>Botellas</a>
        <a class="nav-link" href="historial.html">Historial</a>
        <a class="nav-link platform-admin-only" href="admin-clientes.html" hidden>Clientes</a>
        <a class="nav-link client-admin-only" href="admin-usuarios.html" hidden>Usuarios</a>
      </nav>

      <button id="btnCerrarSesion" class="button button-secondary topbar-action" type="button">Cerrar sesión</button>
    </header>

    <main class="workspace narrow">
      <section class="page-header">
        <div>
          <p class="eyebrow">Catálogo</p>
          <h1 id="titulo">Nueva Botella</h1>
        </div>
      </section>

      <div id="mensaje" class="message" role="status" hidden></div>

      <section class="panel">
        <div class="panel-header">
          <h2>Datos de botella</h2>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" />
          </div>

          <div class="field">
            <label for="pesoVacio">Peso vacío (g)</label>
            <input type="number" id="pesoVacio" />
          </div>

          <div class="field">
            <label for="densidad">Densidad (g/mL)</label>
            <input type="number" id="densidad" step="0.01" value="1" />
          </div>
        </div>

        <div class="form-actions">
          <button id="btnGuardar" type="button" class="button button-primary">Guardar</button>
          <button id="btnCancelar" type="button" class="button button-secondary">Cancelar</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
