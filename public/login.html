<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | BarraExacta</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="login.js"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <a class="brand login-brand" href="login.html">
        <span class="brand-mark">BE</span>
        <span class="brand-name">BarraExacta</span>
      </a>

      <div class="login-header">
        <p class="eyebrow">Acceso demo</p>
        <h1>Iniciar sesión</h1>
      </div>

      <div id="mensaje" class="message" role="status" hidden></div>

      <div class="form-grid login-form">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" />
        </div>
      </div>

      <button id="btnLogin" class="button button-primary login-action" type="button">Entrar</button>
    </section>
  </main>
</body>
</html>
