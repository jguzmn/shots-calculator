<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Botella</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="botella-form.js"></script>
</head>
<body>
  <main class="container">
    <h1 id="titulo">Nueva Botella</h1>

    <div id="mensaje" class="message" role="status" hidden></div>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" />

    <label for="pesoVacio">Peso vacío (g):</label>
    <input type="number" id="pesoVacio" />

    <label for="densidad">Densidad (g/mL):</label>
    <input type="number" id="densidad" step="0.01" value="1" />

    <button id="btnGuardar" type="button">Guardar</button>
    <button id="btnCancelar" type="button" class="button-secondary">Cancelar</button>
  </main>
</body>
</html>
